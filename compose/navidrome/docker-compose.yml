name: navidrome
services:
  navidrome:
    container_name: navidrome
    image: ${NAVIDROME_IMAGE}
    pull_policy: never
    ports:
      - "4533:4533"
    volumes:
      - /var/lib/cloudunit/navidrome/data:/data
      - /var/lib/cloudunit/navidrome/media:/music:ro
    environment:
      ND_SCANSCHEDULE: "1h"
    restart: always
